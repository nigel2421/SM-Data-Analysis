apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-mgmt-frontend
  labels:
    app: school-mgmt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: school-mgmt
  template:
    metadata:
      labels:
        app: school-mgmt
    spec:
      containers:
      - name: frontend
        image: mzalendo/school-mgmt-frontend:latest # Placeholder for actual image
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
